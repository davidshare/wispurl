groups:
  - name: pipeline
    rules:
      - alert: TargetDown
        # Copy compose_service into service, so app targets group and inhibit by
        # service like every other alert. Other targets keep their job label.
        expr: label_replace(up == 0, "service", "$1", "compose_service", "(.+)")
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} is down"
          description: "{{ $labels.instance }} (job {{ $labels.job }}) has failed every scrape for 2 minutes."
          runbook_url: "https://github.com/davidshare/wispurl/blob/master/docs/runbooks/target-down.md"

      # A stopped container drops out of Docker discovery, so its `up` series
      # disappears rather than turning 0 and TargetDown never fires. This catches
      # any service that had a target in the last hour but has none now.
      - alert: ServiceDisappeared
        expr: |
          label_replace(
            count by (compose_service) (max_over_time(up{job="docker-compose-services"}[1h]))
              unless
            count by (compose_service) (up{job="docker-compose-services"}),
            "service", "$1", "compose_service", "(.+)"
          )
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} has no running container"
          description: "{{ $labels.service }} was scraped within the last hour but has no target now. Its container is probably stopped or crash-looping."
          runbook_url: "https://github.com/davidshare/wispurl/blob/master/docs/runbooks/service-disappeared.md"

      # If Alloy stops forwarding, the services' `up` series vanish instead of
      # turning 0, so TargetDown can't fire for them. absent() catches that.
      - alert: MetricsPipelineDown
        expr: absent(up{job="docker-compose-services"})
        for: 5m
        labels:
          severity: critical
          service: alloy
        annotations:
          summary: "No application metrics are arriving"
          description: "No up series for job docker-compose-services for 5 minutes. Alloy or remote write is broken."
          runbook_url: "https://github.com/davidshare/wispurl/blob/master/docs/runbooks/metrics-pipeline-down.md"

  - name: http-red
    rules:
      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(http_requests_total{status=~"5.."}[5m]))
            /
          sum by (service) (rate(http_requests_total[5m]))
            > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }}: more than 5% of requests are failing"
          description: "5xx ratio is {{ $value | humanizePercentage }} over the last 5 minutes."
          runbook_url: "https://github.com/davidshare/wispurl/blob/master/docs/runbooks/high-error-rate.md"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (service, le) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }}: p95 latency above 1s"
          description: "p95 latency is {{ $value | humanizeDuration }}."
          runbook_url: "https://github.com/davidshare/wispurl/blob/master/docs/runbooks/high-latency.md"

  - name: dependencies
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          service: postgres
        annotations:
          summary: "PostgreSQL is unreachable"
          description: "The PostgreSQL exporter cannot connect to the database."
          runbook_url: "https://github.com/davidshare/wispurl/blob/master/docs/runbooks/postgres-down.md"

      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 5m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "PostgreSQL is using more than 80% of max_connections"
          description: "{{ $value | humanizePercentage }} of connections are in use."
          runbook_url: "https://github.com/davidshare/wispurl/blob/master/docs/runbooks/postgres-connections-high.md"

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis is unreachable"
          description: "The Redis exporter cannot connect. Rate limiting falls back to RATE_LIMITER_FAIL_OPEN behaviour."
          runbook_url: "https://github.com/davidshare/wispurl/blob/master/docs/runbooks/redis-down.md"

      - alert: DeadLetterQueueNotEmpty
        expr: rabbitmq_detailed_queue_messages{queue="events.dlq"} > 0
        for: 1m
        labels:
          severity: warning
          service: rabbitmq
        annotations:
          summary: "{{ $value }} message(s) in the dead-letter queue"
          description: "Events failed processing after all retries and were dead-lettered."
          runbook_url: "https://github.com/davidshare/wispurl/blob/master/docs/runbooks/dead-letter-queue-not-empty.md"

      - alert: QueueBacklogGrowing
        expr: rabbitmq_detailed_queue_messages_ready{queue!="events.dlq"} > 1000
        for: 10m
        labels:
          severity: warning
          service: rabbitmq
        annotations:
          summary: "Queue {{ $labels.queue }} has more than 1000 ready messages"
          description: "Consumers are not keeping up with {{ $labels.queue }}."
          runbook_url: "https://github.com/davidshare/wispurl/blob/master/docs/runbooks/queue-backlog-growing.md"

  - name: host
    rules:
      - alert: HostDiskAlmostFull
        # "/" on a Linux host, /var/lib/docker on Docker Desktop's VM: whichever
        # holds Docker's data. min() picks the fuller of the two.
        expr: |
          min(
            node_filesystem_avail_bytes{mountpoint=~"/|/var/lib/docker", fstype!~"tmpfs|erofs"}
              / node_filesystem_size_bytes{mountpoint=~"/|/var/lib/docker", fstype!~"tmpfs|erofs"}
          ) < 0.10
        for: 10m
        labels:
          severity: warning
          service: host
        annotations:
          summary: "Less than 10% disk space left for Docker data"
          description: "Only {{ $value | humanizePercentage }} of the disk holding Docker data is free."
          runbook_url: "https://github.com/davidshare/wispurl/blob/master/docs/runbooks/host-disk-almost-full.md"
