auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 0.0.0.0
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Enforced by the compactor below; without it nothing is ever deleted.
  retention_period: 744h
  # Refuse entries older than 7 days (e.g. a replayed old log file).
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 24

# The compactor applies retention_period: it marks expired chunks and deletes
# them retention_delete_delay later.
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

# Minimal ruler config for local dev (optional but safe)
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  ring:
    kvstore:
      store: inmemory
  enable_api: true

# CRITICAL FIX: Disables the analytics reporter that was causing the 
# "permission denied" error on /loki_cluster_seed.json
analytics:
  reporting_enabled: false