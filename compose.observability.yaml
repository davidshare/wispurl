name: observability

services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:latest}
    restart: unless-stopped
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
  
  loki:
    image: ${LOKI_IMAGE:-grafana/loki:latest}
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yaml
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks:
      - observability
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  tempo:
    image: ${TEMPO_IMAGE:-grafana/tempo:latest}
    restart: unless-stopped
    command:
      - -config.file=/etc/tempo/tempo.yaml
      - -target=all
    ports:
      - "127.0.0.1:${TEMPO_HTTP_PORT:-3200}:3200"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:14250:14250"
      - "127.0.0.1:14268:14268"
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - observability

  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.19.2}
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:${ALLOY_UI_PORT:-12345}:12345"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      # KEEP ONLY IF USING discovery.docker OR loki.source.docker IN config.alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    secrets:
      - postgres_dsn
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_started
    networks:
      - observability
      - wispurl-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:12345/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  observability:
    driver: bridge
  
  wispurl-network:
    external: true
    name: ${WISPURL_NETWORK:-wispurl_wispurl-network}

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  alloy-data:

secrets:
  postgres_dsn:
    file: ./observability/secrets/postgres_dsn.txt