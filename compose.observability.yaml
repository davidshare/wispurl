name: observability

# Cap every container's on-disk log at 3 x 10 MB. Alloy reads the same logs
# through the Docker API, so rotating them locally loses nothing.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.15.0}
    restart: unless-stopped
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-5GB}
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging: *default-logging

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.7.8}
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yaml
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks:
      - observability
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *default-logging

  tempo:
    image: ${TEMPO_IMAGE:-grafana/tempo:3.1.0}
    restart: unless-stopped
    command:
      - -config.file=/etc/tempo/tempo.yaml
      - -target=all
    ports:
      - "127.0.0.1:${TEMPO_HTTP_PORT:-3200}:3200"
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - observability
    healthcheck:
      # The Tempo image has no shell; its binary can check its own /ready endpoint.
      test: ["CMD", "/tempo", "-health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.20.1}
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      # config.alloy reads this to know which Docker network holds the app.
      WISPURL_NETWORK: ${WISPURL_NETWORK:-wispurl_wispurl-network}
    ports:
      - "127.0.0.1:${ALLOY_UI_PORT:-12345}:12345"
      # OTLP for services run directly on the host (containers use alloy:4317).
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      # Docker API: container discovery, log tailing and cAdvisor.
      # Warning: ":ro" on a socket only stops the file being replaced; the API
      # itself stays fully usable. Whoever controls Alloy can control every
      # container on this host. Acceptable on a laptop, not on a shared server.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # cAdvisor reads container details from containerd (same caveat as above).
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      # Host views for the node exporter (CPU, memory, disk, network).
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    # Share the host's cgroup namespace so cAdvisor can see every container's
    # CPU and memory usage, not just Alloy's own.
    cgroup: host
    secrets:
      - postgres_dsn
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    networks:
      - observability
      - wispurl-network
    healthcheck:
      # The Alloy image has bash but no wget/curl/nc, so speak HTTP over /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200 '
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging: *default-logging

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.2.4}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Read the admin password from a Docker secret, never from the compose file.
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      # 3000 is taken by the WispURL frontend.
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    secrets:
      - grafana_admin_password
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.34.1}
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --data.retention=120h
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  # Local stand-in for an email server: catches alert emails and shows them in a web UI.
  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.31.6}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - observability
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

networks:
  observability:
    driver: bridge

  wispurl-network:
    external: true
    name: ${WISPURL_NETWORK:-wispurl_wispurl-network}

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  alloy-data:
  grafana-data:
  alertmanager-data:

secrets:
  postgres_dsn:
    file: ./observability/secrets/postgres_dsn.txt
  grafana_admin_password:
    file: ./observability/secrets/grafana_admin_password.txt
