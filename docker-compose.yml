name: wispurl

# =========================================================================
# YAML ANCHORS FOR OTEL CONFIGURATION
# =========================================================================
x-prometheus-labels: &prometheus-labels
  labels:
    - "prometheus.io/scrape=true"
    - "prometheus.io/port=8000"
    - "prometheus.io/path=/metrics"

x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317

  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none

  OTEL_PROPAGATORS: tracecontext,baggage
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local,service.version=1.0.0

services:
  postgres:
    image: postgres:18
    # Server-side safety nets applied to every connection from every service:
    # cap query/idle-transaction duration and raise the connection ceiling above
    # the sum of all services' bounded pools. (Production should still front this
    # with PgBouncer in transaction mode.)
    command:
      - "postgres"
      - "-c"
      - "statement_timeout=30000"
      - "-c"
      - "idle_in_transaction_session_timeout=60000"
      - "-c"
      - "max_connections=200"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - wispurl-network
    depends_on:
      vault:
        condition: service_healthy
      vault-unseal:
        condition: service_completed_successfully

  pgadmin:
    image: dpage/pgadmin4:9.8
    container_name: wispurl-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-this-password}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wispurl-network

  auth-service:
    build:
      context: ./auth-service
      additional_contexts:
        shared_lib: ./shared

    # Merge the common labels
    <<: *prometheus-labels

    environment:
      # Merge the common OTEL env vars
      <<: *otel-env
      
      # Override/Add service-specific vars
      OTEL_SERVICE_NAME: "auth-service"
      
      VAULT_ADDR: https://vault:8200
      VAULT_ROLE_ID_FILE: /run/secrets/vault-approle.json
      VAULT_CACERT: /run/secrets/vault-ca.pem
      VAULT_SECRET_PATH: wispurl/auth-service
    ports:
      - "8001:8000"
    secrets:
      - source: auth-service-approle
        target: vault-approle.json
      - source: vault-ca
        target: vault-ca.pem
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-unseal:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - wispurl-network

  shortener-service:
    build:
      context: ./shortener-service
      additional_contexts:
        shared_lib: ./shared

    # Merge the common labels
    <<: *prometheus-labels
    
    environment:
      # Merge the common OTEL env vars
      <<: *otel-env
      
      # Override/Add service-specific vars
      OTEL_SERVICE_NAME: "shortener-service"
      
      VAULT_ADDR: https://vault:8200
      VAULT_ROLE_ID_FILE: /run/secrets/vault-approle.json
      VAULT_CACERT: /run/secrets/vault-ca.pem
      VAULT_SECRET_PATH: wispurl/shortener-service
    ports:
      - "8002:8000"
    secrets:
      - source: shortener-service-approle
        target: vault-approle.json
      - source: vault-ca
        target: vault-ca.pem
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-unseal:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - wispurl-network

  analytics-service:
    build:
      context: ./analytics-service
      additional_contexts:
        shared_lib: ./shared

    # Merge the common labels
    <<: *prometheus-labels
    
    environment:
      # Merge the common OTEL env vars
      <<: *otel-env
      
      # Override/Add service-specific vars
      OTEL_SERVICE_NAME: "analytics-service"
      
      VAULT_ADDR: https://vault:8200
      VAULT_ROLE_ID_FILE: /run/secrets/vault-approle.json
      VAULT_CACERT: /run/secrets/vault-ca.pem
      VAULT_SECRET_PATH: wispurl/analytics-service
    # No published ports: /events is internal-only and /stats is reached through
    # the gateway. The service is reachable only on the internal Docker network.
    secrets:
      - source: analytics-service-approle
        target: vault-approle.json
      - source: vault-ca
        target: vault-ca.pem
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-unseal:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - wispurl-network

  # Queue-driven consumer: the SAME analytics image, run as a different process
  # (python -m app.worker) instead of the API. Consumes analytics.clicks, writes
  # click_events, and publishes link.milestone events.
  analytics-consumer-service:
    build:
      context: ./analytics-service
      additional_contexts:
        shared_lib: ./shared
    
    entrypoint: ["python", "-m", "app.worker"]
    environment:
      # Merge the common OTEL env vars
      <<: *otel-env
      
      # Override/Add service-specific vars
      OTEL_SERVICE_NAME: "analytics-consumer-service"
      
      VAULT_ADDR: https://vault:8200
      VAULT_ROLE_ID_FILE: /run/secrets/vault-approle.json
      VAULT_CACERT: /run/secrets/vault-ca.pem
      VAULT_SECRET_PATH: wispurl/analytics-consumer-service
    secrets:
      - source: analytics-consumer-service-approle
        target: vault-approle.json
      - source: vault-ca
        target: vault-ca.pem
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-unseal:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys; sys.exit(0 if os.path.exists('/proc/1/status') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - wispurl-network

  cleanup-service:
    build:
      context: ./cleanup-service
      additional_contexts:
        shared_lib: ./shared
    
    environment:
      # Merge the common OTEL env vars
      <<: *otel-env
      
      # Override/Add service-specific vars
      OTEL_SERVICE_NAME: "cleanup-service"
      
      VAULT_ADDR: https://vault:8200
      VAULT_ROLE_ID_FILE: /run/secrets/vault-approle.json
      VAULT_CACERT: /run/secrets/vault-ca.pem
      VAULT_SECRET_PATH: wispurl/cleanup-service
    # Becomes a Kubernetes CronJob in the DevOps phase (Prompt 10) — no long-running
    # loop there. Here it loops with a sleep as a plain Compose container.
    secrets:
      - source: cleanup-service-approle
        target: vault-approle.json
      - source: vault-ca
        target: vault-ca.pem
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-unseal:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys; sys.exit(0 if os.path.exists('/proc/1/status') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - wispurl-network

  notification-service:
    build:
      context: ./notification-service
      additional_contexts:
        shared_lib: ./shared
    
    environment:
      # Merge the common OTEL env vars
      <<: *otel-env
      
      # Override/Add service-specific vars
      OTEL_SERVICE_NAME: "notification-service"
      
      VAULT_ADDR: https://vault:8200
      VAULT_ROLE_ID_FILE: /run/secrets/vault-approle.json
      VAULT_CACERT: /run/secrets/vault-ca.pem
      VAULT_SECRET_PATH: wispurl/notification-service
    secrets:
      - source: notification-service-approle
        target: vault-approle.json
      - source: vault-ca
        target: vault-ca.pem
    depends_on:
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-unseal:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys; sys.exit(0 if os.path.exists('/proc/1/status') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - wispurl-network

  rate-limiter-service:
    build:
      context: ./rate-limiter-service
      additional_contexts:
        shared_lib: ./shared

    # Merge the common labels
    <<: *prometheus-labels
    
    environment:
      # Merge the common OTEL env vars
      <<: *otel-env
      
      # Override/Add service-specific vars
      OTEL_SERVICE_NAME: "rate-limiter-service"
      
      VAULT_ADDR: https://vault:8200
      VAULT_ROLE_ID_FILE: /run/secrets/vault-approle.json
      VAULT_CACERT: /run/secrets/vault-ca.pem
      VAULT_SECRET_PATH: wispurl/rate-limiter-service
    secrets:
      - source: rate-limiter-service-approle
        target: vault-approle.json
      - source: vault-ca
        target: vault-ca.pem
    # No published ports: /check is internal-only, reached on the Docker network.
    depends_on:
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-unseal:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - wispurl-network

  qr-service:
    build:
      context: ./qr-service
      additional_contexts:
        shared_lib: ./shared
    
    # Merge the common labels
    <<: *prometheus-labels
    
    environment:
      # Merge the common OTEL env vars
      <<: *otel-env
      
      # Override/Add service-specific vars
      OTEL_SERVICE_NAME: "qr-service"
      
      VAULT_ADDR: https://vault:8200
      VAULT_ROLE_ID_FILE: /run/secrets/vault-approle.json
      VAULT_CACERT: /run/secrets/vault-ca.pem
      VAULT_SECRET_PATH: wispurl/qr-service
    secrets:
      - source: qr-service-approle
        target: vault-approle.json
      - source: vault-ca
        target: vault-ca.pem
    depends_on:
      vault:
        condition: service_healthy
      vault-unseal:
        condition: service_completed_successfully
    # No published ports: reached through the gateway at /qr/*. Stateless, so it can
    # be scaled freely (uncomment to demonstrate): deploy.replicas > 1.
    # deploy:
    #   replicas: 2
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - wispurl-network

  gateway:
    build:
      context: ./gateway
      additional_contexts:
        shared_lib: ./shared

    # Merge the common labels
    <<: *prometheus-labels
    
    environment:
      # Merge the common OTEL env vars
      <<: *otel-env
      
      # Override/Add service-specific vars
      OTEL_SERVICE_NAME: "gateway"

      VAULT_ADDR: https://vault:8200
      VAULT_ROLE_ID_FILE: /run/secrets/vault-approle.json
      VAULT_CACERT: /run/secrets/vault-ca.pem
      VAULT_SECRET_PATH: wispurl/gateway
    # The gateway is the only backend port published to the host; all other
    # services are reachable only on the internal Docker network.
    ports:
      - "8080:8000"
    secrets:
      - source: gateway-approle
        target: vault-approle.json
      - source: vault-ca
        target: vault-ca.pem
    depends_on:
      auth-service:
        condition: service_started
      shortener-service:
        condition: service_started
      vault:
        condition: service_healthy
      vault-unseal:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - wispurl-network

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* is inlined at build time; it must be the URL the BROWSER
        # uses to reach the gateway (the host), not the internal Docker hostname.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    environment:
      # Used at runtime by the Next auth route handlers (server-to-gateway), so it
      # uses the internal Docker hostname, not the browser-facing host URL.
      GATEWAY_INTERNAL_URL: ${GATEWAY_INTERNAL_URL:-http://gateway:8000}
    ports:
      - "3000:3000"
    secrets:
      - source: shortener-service-approle
        target: vault-approle.json
      - source: vault-ca
        target: vault-ca.pem
    depends_on:
      gateway:
        condition: service_started
      vault:
        condition: service_healthy
      vault-unseal:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - wispurl-network

  redis:
    image: redis:8
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - wispurl-network
    depends_on:
      vault:
        condition: service_healthy
      vault-unseal:
        condition: service_completed_successfully

  rabbitmq:
    image: rabbitmq:4-management
    command:
      - sh
      - -c
      - |
        rabbitmq-plugins enable --offline rabbitmq_prometheus &&
        rabbitmq-server
    environment:
      # Non-default creds: RabbitMQ's built-in "guest" user may only connect from
      # localhost, so services on the Docker network must authenticate as a real user.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-appuser}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-apppass}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - wispurl-network
    depends_on:
      vault:
        condition: service_healthy
      vault-unseal:
        condition: service_completed_successfully

  vault:
    build:
      context: ./vault
      dockerfile: Dockerfile
    image: wispurl-vault:latest
    # image: hashicorp/vault:2.0.3
    container_name: vault
    restart: unless-stopped
  
    # Required for Vault to lock memory (prevents secrets from swapping to disk)
    cap_add:
      - IPC_LOCK

    ports:
      - "127.0.0.1:8200:8200"
      - "127.0.0.1:8201:8201"

    environment:
      VAULT_ADDR: "https://127.0.0.1:8200"
      VAULT_CACERT: "/vault/tls/ca.pem"

    volumes:
      - ./vault/config:/vault/config:ro
      - ./vault/tls:/vault/tls:ro
      - ./vault/data:/vault/data
      - ./vault/logs:/vault/logs
      - ./vault/snapshots:/vault/snapshots
      - ./vault/approles:/vault/approles

    command: vault server -config=/vault/config/vault.hcl

    healthcheck:
      test: 
        - "CMD"
        - "sh"
        - "-c"
        - "VAULT_CACERT=/vault/tls/ca.pem vault status -address=https://127.0.0.1:8200 2>/dev/null | grep -q 'Initialized'"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - wispurl-network

  vault-unseal:
    image: python:3.12-alpine
    container_name: vault-unseal
    restart: on-failure

    depends_on:
      vault:
        condition: service_started

    environment:
      VAULT_ADDR: "https://vault:8200"
      VAULT_CACERT: "/vault/tls/ca.pem"

    volumes:
      # TLS certs so the sidecar can verify Vault's certificate
      - ./vault/tls:/vault/tls:ro
      # The unseal script itself
      - ./vault/vault-unseal.sh:/vault/vault-unseal.sh:ro
      # Unseal keys stored on the host
      - ./vault/keys:/vault/keys

    command: sh -c "apk add --no-cache wget && sh /vault/vault-unseal.sh"

    networks:
      - wispurl-network

secrets:
  auth-service-approle:
    file: ./vault/approles/auth-service.json
  analytics-service-approle:
    file: ./vault/approles/analytics-service.json
  analytics-consumer-service-approle:
    file: ./vault/approles/analytics-consumer-service.json
  cleanup-service-approle:
    file: ./vault/approles/cleanup-service.json
  gateway-approle:
    file: ./vault/approles/gateway.json
  notification-service-approle:
    file: ./vault/approles/notification-service.json
  qr-service-approle:
    file: ./vault/approles/qr-service.json  
  rate-limiter-service-approle:
    file: ./vault/approles/rate-limiter-service.json
  shortener-service-approle:
    file: ./vault/approles/shortener-service.json

  vault-ca:
    file: ./vault/tls/ca.pem


volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  wispurl-network:
    driver: bridge