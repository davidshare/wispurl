services:
  postgres:
    image: postgres:18
    # Server-side safety nets applied to every connection from every service:
    # cap query/idle-transaction duration and raise the connection ceiling above
    # the sum of all services' bounded pools. (Production should still front this
    # with PgBouncer in transaction mode.)
    command:
      - "postgres"
      - "-c"
      - "statement_timeout=30000"
      - "-c"
      - "idle_in_transaction_session_timeout=60000"
      - "-c"
      - "max_connections=200"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - wispurl-network
    depends_on:
      vault:
        condition: service_healthy
      vault-unseal:
        condition: service_completed_successfully

  auth-service:
    build:
      context: ./auth-service
    environment:
      VAULT_ADDR: https://vault:8200
      VAULT_ROLE_ID_FILE: /run/secrets/vault-approle.json
      VAULT_CACERT: /run/secrets/vault-ca.pem
      VAULT_SECRET_PATH: wispurl/auth-service
      DATABASE_URL: ${AUTH_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8001:8000"
    secrets:
      - source: auth-service-approle
        target: vault-approle.json
      - source: vault-ca
        target: vault-ca.pem
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-unseal:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - wispurl-network

  shortener-service:
    build:
      context: ./shortener-service
    environment:
      DATABASE_URL: ${SHORTENER_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8002}
      RATE_LIMITER_URL: ${RATE_LIMITER_URL:-http://rate-limiter-service:8000}
      ANALYTICS_SERVICE_URL: ${ANALYTICS_SERVICE_URL:-http://analytics-service:8000}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      ANALYTICS_REQUEST_TIMEOUT: ${ANALYTICS_REQUEST_TIMEOUT:-2}
      RATE_LIMITER_REQUEST_TIMEOUT: ${RATE_LIMITER_REQUEST_TIMEOUT:-1}
      RATE_LIMITER_FAIL_OPEN: ${RATE_LIMITER_FAIL_OPEN:-true}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://appuser:apppass@rabbitmq:5672/}
      EVENTS_PUBLISH_ENABLED: ${EVENTS_PUBLISH_ENABLED:-true}
      ANALYTICS_HTTP_FALLBACK: ${ANALYTICS_HTTP_FALLBACK:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8002:8000"
    secrets:
      - source: shortener-service-approle
        target: vault-approle.json
      - source: vault-ca
        target: vault-ca.pem
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-unseal:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - wispurl-network

  analytics-service:
    build:
      context: ./analytics-service
    environment:
      DATABASE_URL: ${ANALYTICS_DATABASE_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      MILESTONES: ${MILESTONES:-100,1000,10000}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://appuser:apppass@rabbitmq:5672/}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # No published ports: /events is internal-only and /stats is reached through
    # the gateway. The service is reachable only on the internal Docker network.
    secrets:
      - source: analytics-service-approle
        target: vault-approle.json
      - source: vault-ca
        target: vault-ca.pem
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-unseal:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - wispurl-network

  # Queue-driven consumer: the SAME analytics image, run as a different process
  # (python -m app.worker) instead of the API. Consumes analytics.clicks, writes
  # click_events, and publishes link.milestone events.
  analytics-consumer:
    build:
      context: ./analytics-service
    entrypoint: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: ${ANALYTICS_DATABASE_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      MILESTONES: ${MILESTONES:-100,1000,10000}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://appuser:apppass@rabbitmq:5672/}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-unseal:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys; sys.exit(0 if os.path.exists('/proc/1/status') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - wispurl-network

  cleanup-service:
    build:
      context: ./cleanup-service
    environment:
      DATABASE_URL: ${SHORTENER_DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://appuser:apppass@rabbitmq:5672/}
      CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-60}
      BATCH_SIZE: ${BATCH_SIZE:-500}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # Becomes a Kubernetes CronJob in the DevOps phase (Prompt 10) — no long-running
    # loop there. Here it loops with a sleep as a plain Compose container.
    secrets:
      - source: cleanup-service-approle
        target: vault-approle.json
      - source: vault-ca
        target: vault-ca.pem
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-unseal:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys; sys.exit(0 if os.path.exists('/proc/1/status') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - wispurl-network

  notification-service:
    build:
      context: ./notification-service
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://appuser:apppass@rabbitmq:5672/}
      NOTIFY_CHANNEL: ${NOTIFY_CHANNEL:-log}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets:
      - source: notification-service-approle
        target: vault-approle.json
      - source: vault-ca
        target: vault-ca.pem
    depends_on:
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-unseal:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys; sys.exit(0 if os.path.exists('/proc/1/status') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - wispurl-network

  rate-limiter-service:
    build:
      context: ./rate-limiter-service
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      WINDOW_SECONDS: ${WINDOW_SECONDS:-3600}
      CREATE_LINK_LIMIT: ${CREATE_LINK_LIMIT:-20}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # No published ports: /check is internal-only, reached on the Docker network.
    depends_on:
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-unseal:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - wispurl-network

  qr-service:
    build:
      context: ./qr-service
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      MIN_SIZE_PX: ${MIN_SIZE_PX:-64}
      MAX_SIZE_PX: ${MAX_SIZE_PX:-1024}
      DEFAULT_SIZE_PX: ${DEFAULT_SIZE_PX:-256}
      CACHE_TTL: ${CACHE_TTL:-86400}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets:
      - source: qr-service-approle
        target: vault-approle.json
      - source: vault-ca
        target: vault-ca.pem
    depends_on:
      vault:
        condition: service_healthy
      vault-unseal:
        condition: service_completed_successfully
    # No published ports: reached through the gateway at /qr/*. Stateless, so it can
    # be scaled freely (uncomment to demonstrate): deploy.replicas > 1.
    # deploy:
    #   replicas: 2
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - wispurl-network

  gateway:
    build:
      context: ./gateway
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8000}
      SHORTENER_SERVICE_URL: ${SHORTENER_SERVICE_URL:-http://shortener-service:8000}
      ANALYTICS_SERVICE_URL: ${ANALYTICS_SERVICE_URL:-http://analytics-service:8000}
      QR_SERVICE_URL: ${QR_SERVICE_URL:-http://qr-service:8000}
      REQUEST_CONNECT_TIMEOUT: ${REQUEST_CONNECT_TIMEOUT:-5}
      REQUEST_READ_TIMEOUT: ${REQUEST_READ_TIMEOUT:-30}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # The gateway is the only backend port published to the host; all other
    # services are reachable only on the internal Docker network.
    ports:
      - "8080:8000"
    secrets:
      - source: gateway-approle
        target: vault-approle.json
      - source: vault-ca
        target: vault-ca.pem
    depends_on:
      auth-service:
        condition: service_started
      shortener-service:
        condition: service_started
      vault:
        condition: service_healthy
      vault-unseal:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - wispurl-network

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* is inlined at build time; it must be the URL the BROWSER
        # uses to reach the gateway (the host), not the internal Docker hostname.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    environment:
      # Used at runtime by the Next auth route handlers (server-to-gateway), so it
      # uses the internal Docker hostname, not the browser-facing host URL.
      GATEWAY_INTERNAL_URL: ${GATEWAY_INTERNAL_URL:-http://gateway:8000}
    ports:
      - "3000:3000"
    secrets:
      - source: shortener-service-approle
        target: vault-approle.json
      - source: vault-ca
        target: vault-ca.pem
    depends_on:
      gateway:
        condition: service_started
      vault:
        condition: service_healthy
      vault-unseal:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - wispurl-network

  redis:
    image: redis:8
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - wispurl-network
    depends_on:
      vault:
        condition: service_healthy
      vault-unseal:
        condition: service_completed_successfully

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      # Non-default creds: RabbitMQ's built-in "guest" user may only connect from
      # localhost, so services on the Docker network must authenticate as a real user.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-appuser}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-apppass}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - wispurl-network
    depends_on:
      vault:
        condition: service_healthy
      vault-unseal:
        condition: service_completed_successfully

  vault:
    build:
      context: ./vault
      dockerfile: Dockerfile
    image: wispurl-vault:latest
    # image: hashicorp/vault:2.0.3
    container_name: vault
    restart: unless-stopped
  
    # Required for Vault to lock memory (prevents secrets from swapping to disk)
    cap_add:
      - IPC_LOCK

    ports:
      - "127.0.0.1:8200:8200"
      - "127.0.0.1:8201:8201"

    environment:
      VAULT_ADDR: "https://127.0.0.1:8200"
      VAULT_CACERT: "/vault/tls/ca.pem"

    volumes:
      - ./vault/config:/vault/config:ro
      - ./vault/tls:/vault/tls:ro
      - ./vault/data:/vault/data
      - ./vault/logs:/vault/logs
      - ./vault/snapshots:/vault/snapshots
      - ./vault/approles:/vault/approles

    command: vault server -config=/vault/config/vault.hcl

    healthcheck:
      test: 
        - "CMD"
        - "sh"
        - "-c"
        - "VAULT_CACERT=/vault/tls/ca.pem vault status -address=https://127.0.0.1:8200 2>/dev/null | grep -q 'Initialized'"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
        - wispurl-network

  vault-unseal:
    image: python:3.12-alpine
    container_name: vault-unseal
    restart: on-failure

    depends_on:
      vault:
        condition: service_started

    environment:
      VAULT_ADDR: "https://vault:8200"
      VAULT_CACERT: "/vault/tls/ca.pem"

    volumes:
      # TLS certs so the sidecar can verify Vault's certificate
      - ./vault/tls:/vault/tls:ro
      # The unseal script itself
      - ./vault/vault-unseal.sh:/vault/vault-unseal.sh:ro
      # Unseal keys stored on the host
      - ./vault/keys:/vault/keys

    command: sh -c "apk add --no-cache wget && sh /vault/vault-unseal.sh"

    networks:
      - wispurl-network

secrets:
  auth-service-approle:
    file: ./vault/approles/auth-service.json
  analytics-service-approle:
    file: ./vault/approles/analytics-service.json
  cleanup-service-approle:
    file: ./vault/approles/cleanup-service.json
  gateway-approle:
    file: ./vault/approles/gateway.json
  notification-service-approle:
    file: ./vault/approles/notification-service.json
  qr-service-approle:
    file: ./vault/approles/qr-service.json  
  rate-limiter-service-approle:
    file: ./vault/approles/rate-limiter-service.json
  shortener-service-approle:
    file: ./vault/approles/shortener-service.json

  vault-ca:
    file: ./vault/tls/ca.pem


volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
networks:
  wispurl-network:
    driver: bridge